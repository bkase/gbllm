[project]
name = "gbtrain"
version = "0.1.0"
description = "MLX/Metal teacher-student training for the Game Boy LLM (subword, TinyStories, MoE)"
requires-python = ">=3.11"
dependencies = [
    "mlx>=0.29",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gbtrain"]
